<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wuji Quartet Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a84ff'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="realbar" hidden>REAL HAND · commands move the physical hand</div>
<header id="header">
  <span class="badge">W</span>
  <span class="brand">Wuji Quartet</span>
  <span id="crumb" class="crumb"></span>
  <span class="grow"></span>
  <button id="stopall" class="pill danger big" hidden>■ Stop the hand</button>
  <span id="modechip" class="chip mode" title="Which hand the Play, Teach and Camera pages use. Click to change."></span>
</header>
<div id="middle">
  <nav id="sidebar"></nav>
  <main id="content"></main>
</div>
<section id="logdrawer" hidden>
  <div class="logbar">
    <b>Log</b>
    <select id="logjob"></select>
    <span class="grow"></span>
    <span id="logstate" class="subtle small"></span>
  </div>
  <pre id="logtext"></pre>
</section>
<footer id="statusbar">
  <span class="st" id="st-sim"><i class="dot"></i><span class="k">Simulation</span><b></b></span>
  <span class="st" id="st-hand"><i class="dot"></i><span class="k">Hand</span><b></b></span>
  <span class="st" id="st-compute"><i class="dot"></i><span class="k">Optimiser</span><b></b></span>
  <span class="st" id="st-camera"><i class="dot"></i><span class="k">Camera</span><b></b></span>
  <span class="grow"></span>
  <span id="flash"></span>
  <a id="loglink" href="#">Log ▴</a>
</footer>
<div id="modal" hidden><div class="dialog" role="dialog" aria-modal="true"></div></div>
<script src="/static/core.js"></script>
<script src="/static/stage.js"></script>
<script src="/static/pages.js"></script>
<script src="/static/pages2.js"></script>
</body>
</html>
